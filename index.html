<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Prescription Counter</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 20px 14px 40px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 18px;
      padding: 22px 18px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .title {
      margin: 0 0 10px;
      font-size: 25px;
      font-weight: 700;
    }

    .doctor {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .date {
      font-size: 15px;
      color: #6b7280;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .product-image-wrapper {
      width: 100%;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 14px;
      background: #fafafa;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-name {
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 14px;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .counter-button {
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      font-size: 32px;
      font-weight: 400;
      cursor: pointer;
      background: #e9edf2;
      color: #111827;
      touch-action: manipulation;
    }

    .counter-button:active {
      transform: scale(0.94);
    }

    .quantity {
      min-width: 50px;
      text-align: center;
      font-size: 30px;
      font-weight: 700;
    }

    .attach-button {
      width: 100%;
      min-height: 50px;
      border: 2px dashed #b8c0ca;
      border-radius: 12px;
      background: #fafbfc;
      color: #374151;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px;
      touch-action: manipulation;
    }

    .attach-button:active {
      transform: scale(0.98);
    }

    .file-input {
      display: none;
    }

    .images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .image-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #eee;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-image {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 17px;
      line-height: 28px;
      padding: 0;
      cursor: pointer;
    }

    .image-count {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
    }

    /* =================================================
       BUTTONS
       ================================================= */

    .submit-button,
    .quantity-button {
      width: 100%;
      min-height: 60px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      touch-action: manipulation;
    }

    .submit-button {
      background: #111827;
    }

    .quantity-button {
      background: #374151;
      margin-top: 12px;
    }

    .submit-button:active,
    .quantity-button:active {
      transform: scale(0.98);
    }

    .submit-button:disabled,
    .quantity-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =================================================
       STATUS
       ================================================= */

    .status {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-top: 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    /* =================================================
       MONTHLY RESULTS
       ================================================= */

    .monthly-section {
      display: none;
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-top: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .monthly-title {
      text-align: center;
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 700;
    }

    .monthly-subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .monthly-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .monthly-product {
      background: #f8fafc;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .monthly-product-image {
      width: 100%;
      height: 100px;
      object-fit: contain;
      display: block;
      margin-bottom: 8px;
      border-radius: 10px;
      background: white;
    }

    .monthly-product-name {
      font-size: 14px;
      font-weight: 700;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .monthly-quantity {
      margin-top: 7px;
      font-size: 25px;
      font-weight: 700;
      color: #111827;
    }

    .monthly-label {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    @media (max-width: 420px) {

      body {
        padding: 12px 10px 30px;
      }

      .product-image-wrapper {
        height: 165px;
      }

      .product-name {
        font-size: 17px;
      }

      .counter-button {
        width: 54px;
        height: 54px;
      }

      .monthly-product-image {
        height: 85px;
      }

      .monthly-product-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div class="header">

    <h1 class="title">
      Prescription Counter
    </h1>

    <div class="doctor">
      Dr. Ahmad Kousa
    </div>

    <div
      class="date"
      id="currentDate"
    >
      Loading date...
    </div>

  </div>


  <!-- ================================================= -->
  <!-- PHYSIOLOGICA ISO SPRAY -->
  <!-- ================================================= -->

  <div
    class="product-card"
    data-product="Physiologica Iso Spray"
  >

    <div class="product-image-wrapper">

      <img
        class="product-image"
        src="physiologica-iso.jpg"
        alt="Physiologica Iso Spray"
      >

    </div>

    <div class="product-name">
      Physiologica Iso Spray
    </div>

    <div class="counter">

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, -1)"
      >
        −
      </button>

      <div class="quantity">
        0
      </div>

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, 1)"
      >
        +
      </button>

    </div>

    <input
      class="file-input"
      type="file"
      accept="image/*"
      multiple
      onchange="handleImages(this)"
    >

    <button
      class="attach-button"
      type="button"
      onclick="openFilePicker(this)"
    >
      📷 Attach Images
    </button>

    <div class="images"></div>

    <div class="image-count"></div>

  </div>


  <!-- ================================================= -->
  <!-- PHYSIOLOGICA HYPER SPRAY -->
  <!-- ================================================= -->

  <div
    class="product-card"
    data-product="Physiologica Hyper Spray"
  >

    <div class="product-image-wrapper">

      <img
        class="product-image"
        src="physiologica-hyper.jpg"
        alt="Physiologica Hyper Spray"
      >

    </div>

    <div class="product-name">
      Physiologica Hyper Spray
    </div>

    <div class="counter">

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, -1)"
      >
        −
      </button>

      <div class="quantity">
        0
      </div>

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, 1)"
      >
        +
      </button>

    </div>

    <input
      class="file-input"
      type="file"
      accept="image/*"
      multiple
      onchange="handleImages(this)"
    >

    <button
      class="attach-button"
      type="button"
      onclick="openFilePicker(this)"
    >
      📷 Attach Images
    </button>

    <div class="images"></div>

    <div class="image-count"></div>

  </div>


  <!-- ================================================= -->
  <!-- PRIVITUS -->
  <!-- ================================================= -->

  <div
    class="product-card"
    data-product="Privitus"
  >

    <div class="product-image-wrapper">

      <img
        class="product-image"
        src="privitus.jpg"
        alt="Privitus"
      >

    </div>

    <div class="product-name">
      Privitus
    </div>

    <div class="counter">

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, -1)"
      >
        −
      </button>

      <div class="quantity">
        0
      </div>

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, 1)"
      >
        +
      </button>

    </div>

    <input
      class="file-input"
      type="file"
      accept="image/*"
      multiple
      onchange="handleImages(this)"
    >

    <button
      class="attach-button"
      type="button"
      onclick="openFilePicker(this)"
    >
      📷 Attach Images
    </button>

    <div class="images"></div>

    <div class="image-count"></div>

  </div>


  <!-- ================================================= -->
  <!-- TOULACOUGH -->
  <!-- ================================================= -->

  <div
    class="product-card"
    data-product="ToulaCough"
  >

    <div class="product-image-wrapper">

      <img
        class="product-image"
        src="toulacough.jpg"
        alt="ToulaCough"
      >

    </div>

    <div class="product-name">
      ToulaCough
    </div>

    <div class="counter">

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, -1)"
      >
        −
      </button>

      <div class="quantity">
        0
      </div>

      <button
        class="counter-button"
        type="button"
        onclick="changeQuantity(this, 1)"
      >
        +
      </button>

    </div>

    <input
      class="file-input"
      type="file"
      accept="image/*"
      multiple
      onchange="handleImages(this)"
    >

    <button
      class="attach-button"
      type="button"
      onclick="openFilePicker(this)"
    >
      📷 Attach Images
    </button>

    <div class="images"></div>

    <div class="image-count"></div>

  </div>


  <!-- ================================================= -->
  <!-- SUBMIT -->
  <!-- ================================================= -->

  <button
    class="submit-button"
    id="submitButton"
    type="button"
    onclick="submitPrescriptions()"
  >
    SUBMIT
  </button>


  <!-- ================================================= -->
  <!-- GET MONTHLY QUANTITY -->
  <!-- ================================================= -->

  <button
    class="quantity-button"
    id="quantityButton"
    type="button"
    onclick="getMonthlyQuantity()"
  >
    📊 Get All Quantity Prescription
  </button>


  <!-- ================================================= -->
  <!-- STATUS -->
  <!-- ================================================= -->

  <div
    class="status"
    id="status"
  ></div>


  <!-- ================================================= -->
  <!-- MONTHLY RESULTS -->
  <!-- ================================================= -->

  <div
    class="monthly-section"
    id="monthlySection"
  >

    <div class="monthly-title">
      Monthly Prescription Quantity
    </div>

    <div
      class="monthly-subtitle"
      id="monthlySubtitle"
    >
      Current month
    </div>

    <div
      class="monthly-grid"
      id="monthlyGrid"
    ></div>

  </div>

</div>


<script>

  // =====================================================
  // SETTINGS
  // =====================================================

  const DOCTOR_NAME =
    "Dr. Ahmad Kousa";


  /*
    TEST URL FOR SAVING PRESCRIPTIONS

    We keep this on webhook-test for now
    because we are currently testing the
    image upload workflow.
  */

  const SAVE_WEBHOOK_URL =
    "https://ids-server.duckdns.org/webhook-test/save-prescription";


  /*
    PRODUCTION URL FOR GETTING MONTHLY QUANTITY

    This connects to the workflow:
    Get Prescription Quantity
  */

  const QUANTITY_WEBHOOK_URL =
    "https://ids-server.duckdns.org/webhook/get-prescription-quantity";


  // =====================================================
  // PRODUCT INFORMATION
  // =====================================================

  const PRODUCT_IMAGES = {

    "Physiologica Iso Spray":
      "physiologica-iso.jpg",

    "Physiologica Hyper Spray":
      "physiologica-hyper.jpg",

    "Privitus":
      "privitus.jpg",

    "ToulaCough":
      "toulacough.jpg"

  };


  // =====================================================
  // DATE
  // =====================================================

  function setCurrentDate() {

    const now =
      new Date();

    const options = {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    };

    const formattedDate =
      now.toLocaleDateString(
        "en-GB",
        options
      );

    document.getElementById(
      "currentDate"
    ).textContent =
      formattedDate;
  }


  // =====================================================
  // CHANGE QUANTITY
  // =====================================================

  function changeQuantity(button, change) {

    const card =
      button.closest(".product-card");

    const quantityElement =
      card.querySelector(".quantity");

    let quantity =
      parseInt(
        quantityElement.textContent,
        10
      ) || 0;

    quantity += change;

    if (quantity < 0) {
      quantity = 0;
    }

    quantityElement.textContent =
      quantity;
  }


  // =====================================================
  // OPEN FILE PICKER
  // =====================================================

  function openFilePicker(button) {

    const card =
      button.closest(".product-card");

    const fileInput =
      card.querySelector(".file-input");

    fileInput.click();
  }


  // =====================================================
  // HANDLE IMAGES
  // =====================================================

  function handleImages(input) {

    const card =
      input.closest(".product-card");

    const imagesContainer =
      card.querySelector(".images");

    const files =
      Array.from(input.files);


    if (!card._prescriptionFiles) {

      card._prescriptionFiles = [];

    }


    files.forEach(file => {

      if (!file.type.startsWith("image/")) {
        return;
      }


      const fileIndex =
        card._prescriptionFiles.length;


      /*
        Keep the original File object.
      */

      card._prescriptionFiles.push(
        file
      );


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const wrapper =
            document.createElement(
              "div"
            );

          wrapper.className =
            "image-item";

          wrapper.dataset.fileIndex =
            fileIndex;


          const image =
            document.createElement(
              "img"
            );

          image.src =
            event.target.result;


          const removeButton =
            document.createElement(
              "button"
            );

          removeButton.className =
            "remove-image";

          removeButton.type =
            "button";

          removeButton.textContent =
            "×";


          removeButton.onclick =
            function() {

              const index =
                parseInt(
                  wrapper.dataset.fileIndex,
                  10
                );


              if (
                !isNaN(index) &&
                card._prescriptionFiles[index]
              ) {

                card._prescriptionFiles[index] =
                  null;

              }


              wrapper.remove();

              updateImageCount(
                card
              );
            };


          wrapper.appendChild(
            image
          );

          wrapper.appendChild(
            removeButton
          );

          imagesContainer.appendChild(
            wrapper
          );


          updateImageCount(
            card
          );

        };


      reader.readAsDataURL(
        file
      );

    });


    /*
      Allow selecting more images
      later, including the same file.
    */

    input.value = "";

  }


  // =====================================================
  // IMAGE COUNT
  // =====================================================

  function updateImageCount(card) {

    const count =
      (
        card._prescriptionFiles ||
        []
      ).filter(
        file => file !== null
      ).length;


    const imageCount =
      card.querySelector(
        ".image-count"
      );


    if (count === 0) {

      imageCount.textContent =
        "";

    } else {

      imageCount.textContent =
        count === 1
          ? "1 image attached"
          : count + " images attached";

    }

  }


  // =====================================================
  // COLLECT PRODUCTS
  // =====================================================

  function collectProducts() {

    const cards =
      document.querySelectorAll(
        ".product-card"
      );

    const products = [];


    cards.forEach(card => {

      const product =
        card.dataset.product;


      const quantity =
        parseInt(
          card.querySelector(
            ".quantity"
          ).textContent,
          10
        ) || 0;


      const files =
        (
          card._prescriptionFiles ||
          []
        ).filter(
          file => file !== null
        );


      if (
        quantity > 0 ||
        files.length > 0
      ) {

        products.push({

          product:
            product,

          quantity:
            quantity,

          imageCount:
            files.length

        });

      }

    });


    return products;

  }


  // =====================================================
  // SUBMIT PRESCRIPTIONS
  // =====================================================

  async function submitPrescriptions() {

    const status =
      document.getElementById(
        "status"
      );


    const submitButton =
      document.getElementById(
        "submitButton"
      );


    const products =
      collectProducts();


    if (
      products.length === 0
    ) {

      status.style.display =
        "block";

      status.textContent =
        "Please select at least one product.";

      return;
    }


    submitButton.disabled =
      true;

    submitButton.textContent =
      "SENDING...";


    status.style.display =
      "block";

    status.textContent =
      "Sending prescription data...";


    try {

      const formData =
        new FormData();


      // Doctor
      formData.append(
        "doctor",
        DOCTOR_NAME
      );


      // Exact date/time
      const submissionDate =
        new Date().toISOString();


      formData.append(
        "date",
        submissionDate
      );


      // Product information
      formData.append(
        "products",
        JSON.stringify(
          products
        )
      );


      let imageNumber =
        0;


      const cards =
        document.querySelectorAll(
          ".product-card"
        );


      cards.forEach(card => {

        const product =
          card.dataset.product;


        const files =
          (
            card._prescriptionFiles ||
            []
          ).filter(
            file => file !== null
          );


        files.forEach(file => {

          const fieldName =
            "image_" +
            imageNumber;


          /*
            Actual binary image.
          */

          formData.append(
            fieldName,
            file,
            file.name
          );


          /*
            Product linked to this image.
          */

          formData.append(
            "image_" +
            imageNumber +
            "_product",
            product
          );


          imageNumber++;

        });

      });


      formData.append(
        "imageCount",
        String(imageNumber)
      );


      // =================================================
      // SEND
      // =================================================

      const response =
        await fetch(
          SAVE_WEBHOOK_URL,
          {
            method: "POST",
            body: formData
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      let result = null;


      try {

        result =
          await response.json();

      } catch (error) {

        // Response isn't JSON.

      }


      console.log(
        "n8n response:",
        result
      );


      status.style.display =
        "block";

      status.textContent =
        "✅ Submitted successfully";


      submitButton.textContent =
        "SUBMITTED";


    } catch (error) {

      console.error(
        "Submit error:",
        error
      );


      status.style.display =
        "block";

      status.textContent =
        "❌ Could not submit. Please try again.";


      submitButton.disabled =
        false;

      submitButton.textContent =
        "SUBMIT";

    }

  }


  // =====================================================
  // GET MONTHLY QUANTITY
  // =====================================================

  async function getMonthlyQuantity() {

    const button =
      document.getElementById(
        "quantityButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    const section =
      document.getElementById(
        "monthlySection"
      );


    const grid =
      document.getElementById(
        "monthlyGrid"
      );


    const subtitle =
      document.getElementById(
        "monthlySubtitle"
      );


    button.disabled =
      true;

    button.textContent =
      "LOADING...";


    status.style.display =
      "block";

    status.textContent =
      "Getting monthly prescription quantity...";


    try {

      const response =
        await fetch(
          QUANTITY_WEBHOOK_URL,
          {
            method: "GET"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      console.log(
        "Monthly quantity:",
        data
      );


      // =================================================
      // CLEAR OLD RESULTS
      // =================================================

      grid.innerHTML =
        "";


      // =================================================
      // MONTH
      // =================================================

      if (data.month) {

        subtitle.textContent =
          "Month: " +
          data.month;

      } else {

        subtitle.textContent =
          "Current month";

      }


      // =================================================
      // PRODUCTS
      // =================================================

      const products =
        Array.isArray(
          data.products
        )
          ? data.products
          : [];


      /*
        Always display the four products
        in the same order.
      */

      const productOrder = [

        "Physiologica Iso Spray",

        "Physiologica Hyper Spray",

        "Privitus",

        "ToulaCough"

      ];


      productOrder.forEach(
        productName => {

          const found =
            products.find(
              item =>
                item.product ===
                productName
            );


          const quantity =
            found
              ? Number(
                  found.quantity
                ) || 0
              : 0;


          const card =
            document.createElement(
              "div"
            );

          card.className =
            "monthly-product";


          const image =
            document.createElement(
              "img"
            );

          image.className =
            "monthly-product-image";

          image.src =
            PRODUCT_IMAGES[
              productName
            ];

          image.alt =
            productName;


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "monthly-product-name";

          name.textContent =
            productName;


          const quantityElement =
            document.createElement(
              "div"
            );

          quantityElement.className =
            "monthly-quantity";

          quantityElement.textContent =
            quantity;


          const label =
            document.createElement(
              "div"
            );

          label.className =
            "monthly-label";

          label.textContent =
            "prescriptions";


          card.appendChild(
            image
          );

          card.appendChild(
            name
          );

          card.appendChild(
            quantityElement
          );

          card.appendChild(
            label
          );


          grid.appendChild(
            card
          );

        }
      );


      // =================================================
      // SHOW RESULTS
      // =================================================

      section.style.display =
        "block";


      status.style.display =
        "none";


      button.disabled =
        false;

      button.textContent =
        "🔄 Refresh Monthly Quantity";


      // Scroll smoothly to results
      section.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });


    } catch (error) {

      console.error(
        "Quantity error:",
        error
      );


      status.style.display =
        "block";

      status.textContent =
        "❌ Could not get monthly quantity.";


      button.disabled =
        false;

      button.textContent =
        "📊 Get All Quantity Prescription";

    }

  }


  // =====================================================
  // INITIALIZE
  // =====================================================

  setCurrentDate();

</script>

</body>
</html>
