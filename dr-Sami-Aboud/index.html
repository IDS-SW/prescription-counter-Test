<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prescription Counter - Dr. Sami Aboud</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.header {
  background: #ffffff;
  padding: 20px 16px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  position: sticky;
  top: 0;
  z-index: 10;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.header .date {
  margin-top: 6px;
  font-size: 14px;
  color: #666;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 16px;
}

.product-card {
  background: #fff;
  border-radius: 16px;
  margin-bottom: 16px;
  padding: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.product-image {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 12px;
  margin-bottom: 12px;
  background: #f7f7f7;
}

.product-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.quantity-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 12px 0 16px;
}

.quantity-btn {
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: #eeeeee;
  font-size: 28px;
  cursor: pointer;
}

.quantity {
  min-width: 45px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.upload-label {
  display: block;
  text-align: center;
  background: #f0f3f5;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  font-size: 15px;
}

.upload-input {
  display: none;
}

.selected-images {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.selected-image-wrapper {
  position: relative;
  width: 70px;
  height: 70px;
}

.selected-image {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
}

.remove-image {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 50%;
  background: #d93025;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.submit-btn,
.summary-btn {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.submit-btn {
  background: #222;
  color: #fff;
}

.summary-btn {
  background: #e9ecef;
  color: #222;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  display: none;
  margin: 16px 0;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
  font-size: 15px;
}

.message.success {
  display: block;
  background: #dff5e3;
  color: #18733a;
}

.message.error {
  display: block;
  background: #fde2e2;
  color: #b42318;
}

#summaryPage {
  display: none;
}

.summary-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 6px;
}

.summary-month {
  color: #666;
  margin-bottom: 18px;
}

.summary-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.07);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.summary-product {
  font-weight: bold;
}

.summary-quantity {
  font-size: 22px;
  font-weight: bold;
}

.back-btn {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  background: #222;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
</head>

<body>

<div class="header">
  <h1>Prescription Counter</h1>
  <div class="date" id="currentDate"></div>
</div>

<div class="container">

  <div id="mainPage">

    <div id="productsContainer"></div>

    <div id="message" class="message"></div>

    <button
      class="submit-btn"
      id="submitBtn"
      onclick="submitPrescription()"
    >
      Submit Prescription
    </button>

    <button
      class="summary-btn"
      onclick="showSummary()"
    >
      Monthly Summary
    </button>

  </div>

  <div id="summaryPage">

    <div class="summary-title">
      Monthly Summary
    </div>

    <div class="summary-month" id="summaryMonth"></div>

    <div id="summaryContainer">
      <div class="loading">Loading...</div>
    </div>

    <button
      class="back-btn"
      onclick="showMainPage()"
    >
      Back
    </button>

  </div>

</div>

<script>

const DOCTOR_NAME = "Dr. Sami Aboud";

const SAVE_WEBHOOK =
  "https://ids-server.duckdns.org/webhook/save-prescription";

const QUANTITY_WEBHOOK =
  "https://ids-server.duckdns.org/webhook/get-prescription-quantity";


const PRODUCTS = [
  {
    name: "Physiologica Iso Spray",
    image: "../physiologica-iso.jpg"
  },
  {
    name: "Physiologica Hyper Spray",
    image: "../physiologica-hyper.jpg"
  },
  {
    name: "Privitus",
    image: "../privitus.jpg"
  },
  {
    name: "ToulaCough",
    image: "../toulacough.jpg"
  }
];


const quantities = {};
const selectedImages = {};


PRODUCTS.forEach((product, index) => {
  quantities[index] = 0;
  selectedImages[index] = [];
});


function getDubaiDate() {

  const now = new Date();

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Dubai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(now);
}


function getDubaiMonth() {

  const date = getDubaiDate();

  return date.substring(0, 7);
}


function formatDisplayDate(dateString) {

  const parts = dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  return `${parts[2]}-${parts[1]}-${parts[0]}`;
}


document.getElementById("currentDate").textContent =
  formatDisplayDate(getDubaiDate());


function renderProducts() {

  const container =
    document.getElementById("productsContainer");

  container.innerHTML = "";

  PRODUCTS.forEach((product, index) => {

    const card = document.createElement("div");

    card.className = "product-card";

    card.innerHTML = `
      <img
        src="${product.image}"
        class="product-image"
        alt="${product.name}"
      >

      <div class="product-name">
        ${product.name}
      </div>

      <div class="quantity-row">

        <button
          type="button"
          class="quantity-btn"
          onclick="changeQuantity(${index}, -1)"
        >
          −
        </button>

        <div
          class="quantity"
          id="quantity-${index}"
        >
          0
        </div>

        <button
          type="button"
          class="quantity-btn"
          onclick="changeQuantity(${index}, 1)"
        >
          +
        </button>

      </div>

      <label
        class="upload-label"
        for="file-${index}"
      >
        📷 Add Photo
      </label>

      <input
        type="file"
        id="file-${index}"
        class="upload-input"
        accept="image/*"
        multiple
        onchange="handleFiles(${index}, this.files)"
      >

      <div
        class="selected-images"
        id="selected-images-${index}"
      ></div>
    `;

    container.appendChild(card);

  });

}


function changeQuantity(index, amount) {

  quantities[index] += amount;

  if (quantities[index] < 0) {
    quantities[index] = 0;
  }

  document.getElementById(
    `quantity-${index}`
  ).textContent = quantities[index];

}


function handleFiles(index, files) {

  const fileArray = Array.from(files || []);

  selectedImages[index] = fileArray;

  renderSelectedImages(index);

}


function renderSelectedImages(index) {

  const container =
    document.getElementById(`selected-images-${index}`);

  container.innerHTML = "";

  selectedImages[index].forEach((file, fileIndex) => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "selected-image-wrapper";

    const img =
      document.createElement("img");

    img.className =
      "selected-image";

    img.src =
      URL.createObjectURL(file);

    const removeBtn =
      document.createElement("button");

    removeBtn.type = "button";

    removeBtn.className =
      "remove-image";

    removeBtn.textContent = "×";

    removeBtn.onclick = function() {

      selectedImages[index].splice(fileIndex, 1);

      renderSelectedImages(index);

    };

    wrapper.appendChild(img);
    wrapper.appendChild(removeBtn);

    container.appendChild(wrapper);

  });

}


function showMessage(message, type) {

  const element =
    document.getElementById("message");

  element.textContent = message;

  element.className =
    `message ${type}`;

}


function clearMessage() {

  const element =
    document.getElementById("message");

  element.textContent = "";

  element.className =
    "message";

}


async function submitPrescription() {

  clearMessage();

  const submitBtn =
    document.getElementById("submitBtn");

  const productsToSave = [];

  PRODUCTS.forEach((product, index) => {

    const quantity =
      Number(quantities[index] || 0);

    if (quantity > 0) {

      productsToSave.push({
        product: product.name,
        quantity: quantity
      });

    }

  });


  if (productsToSave.length === 0) {

    showMessage(
      "Please select at least one product quantity.",
      "error"
    );

    return;
  }


  submitBtn.disabled = true;

  submitBtn.textContent = "Submitting...";


  try {

    const formData = new FormData();

    formData.append(
      "doctor",
      DOCTOR_NAME
    );

    formData.append(
      "date",
      getDubaiDate()
    );

    formData.append(
      "products",
      JSON.stringify(productsToSave)
    );


    let imageIndex = 0;


    PRODUCTS.forEach((product, productIndex) => {

      const files =
        selectedImages[productIndex] || [];

      files.forEach(file => {

        const fieldName =
          `image_${imageIndex}`;

        formData.append(
          fieldName,
          file,
          file.name
        );

        formData.append(
          `${fieldName}_product`,
          product.name
        );

        imageIndex++;

      });

    });


    formData.append(
      "imageCount",
      String(imageIndex)
    );


    const response =
      await fetch(
        SAVE_WEBHOOK,
        {
          method: "POST",
          body: formData
        }
      );


    if (!response.ok) {

      throw new Error(
        `Server error ${response.status}`
      );

    }


    let result = {};

    try {

      result =
        await response.json();

    } catch (jsonError) {

      result = {};

    }


    if (
      result.success === false
    ) {

      throw new Error(
        result.message ||
        "The system rejected the request."
      );

    }


    showMessage(
      "Prescription saved successfully.",
      "success"
    );


    PRODUCTS.forEach((product, index) => {

      quantities[index] = 0;

      selectedImages[index] = [];

      document.getElementById(
        `quantity-${index}`
      ).textContent = "0";

      const input =
        document.getElementById(`file-${index}`);

      if (input) {
        input.value = "";
      }

      renderSelectedImages(index);

    });


  } catch (error) {

    console.error(
      "SUBMIT ERROR:",
      error
    );

    let errorMessage =
      "Failed to submit prescription.";

    if (
      error &&
      error.message
    ) {

      errorMessage +=
        ` ${error.message}`;

    }

    showMessage(
      errorMessage,
      "error"
    );

  } finally {

    submitBtn.disabled = false;

    submitBtn.textContent =
      "Submit Prescription";

  }

}


async function showSummary() {

  document.getElementById("mainPage").style.display =
    "none";

  document.getElementById("summaryPage").style.display =
    "block";

  const summaryContainer =
    document.getElementById("summaryContainer");

  summaryContainer.innerHTML =
    `<div class="loading">Loading...</div>`;


  const month =
    getDubaiMonth();

  document.getElementById("summaryMonth").textContent =
    month;


  try {

    const url =
      `${QUANTITY_WEBHOOK}?doctor=${encodeURIComponent(DOCTOR_NAME)}`;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        `Server error ${response.status}`
      );

    }


    const result =
      await response.json();


    const products =
      Array.isArray(result.products)
        ? result.products
        : [];


    summaryContainer.innerHTML = "";


    if (products.length === 0) {

      summaryContainer.innerHTML =
        `<div class="loading">No data available.</div>`;

      return;

    }


    products.forEach(item => {

      const card =
        document.createElement("div");

      card.className =
        "summary-card";


      const productName =
        document.createElement("div");

      productName.className =
        "summary-product";

      productName.textContent =
        item.product || "";


      const quantity =
        document.createElement("div");

      quantity.className =
        "summary-quantity";

      quantity.textContent =
        Number(item.quantity || 0);


      card.appendChild(productName);
      card.appendChild(quantity);

      summaryContainer.appendChild(card);

    });


  } catch (error) {

    console.error(
      "SUMMARY ERROR:",
      error
    );

    summaryContainer.innerHTML =
      `<div class="message error">
        Failed to load monthly summary.
      </div>`;

  }

}


function showMainPage() {

  document.getElementById("summaryPage").style.display =
    "none";

  document.getElementById("mainPage").style.display =
    "block";

}


renderProducts();

</script>

</body>
</html>
